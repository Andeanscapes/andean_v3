name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'
          cache: 'npm'
      - run: npm ci
      # Build-time values come from repository Variables. Do not add secrets here:
      # NEXT_PUBLIC_* values are intentionally embedded in the browser bundle.
      - name: Check build variables are configured
        run: |
          for name in REMOTE_DATA_BASE_URL NEXT_PUBLIC_WHATSAPP_PHONE_NUMBER; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Set the corresponding repository Variable under Settings > Secrets and variables > Actions > Variables."
              exit 1
            fi
          done
        env:
          REMOTE_DATA_BASE_URL: ${{ vars.REMOTE_DATA_BASE_URL_PROD }}
          NEXT_PUBLIC_WHATSAPP_PHONE_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_PHONE_NUMBER }}
      - run: npm run lint
      - run: npm run typecheck
      # The feed payloads are real data and are not committed, so `pretest`
      # downloads them into the gitignored `fixtures/` directory first. Without
      # the base URL the download fails and the service tests cannot run.
      - run: npm run test
        env:
          REMOTE_DATA_BASE_URL: ${{ vars.REMOTE_DATA_BASE_URL_PROD }}
      # The build prerenders pages from the remote feed and there is no local
      # fallback, so the base URL is required. This makes CI depend on the CDN.
      - run: npm run build
        env:
          REMOTE_DATA_BASE_URL: ${{ vars.REMOTE_DATA_BASE_URL_PROD }}
          NEXT_PUBLIC_WHATSAPP_PHONE_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_PHONE_NUMBER }}
      # Confirms the live feed still satisfies the schemas the app validates on
      # read — the feed is hand-edited, so this is the only write-side gate.
      - run: npm run verify:feed
        env:
          REMOTE_DATA_BASE_URL: ${{ vars.REMOTE_DATA_BASE_URL_PROD }}
      - run: npm audit --audit-level=high
