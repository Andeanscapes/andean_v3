# andean_v3/wrangler.toml
name = "andean-v3"
# `worker.ts` wraps `.open-next/worker.js` with the edge HTML cache.
main = "worker.ts"
compatibility_date = "2024-12-31"
compatibility_flags = ["nodejs_compat"]

routes = [
	{ pattern = "andeanscapes.com/*", zone_name = "andeanscapes.com" },
	{ pattern = "www.andeanscapes.com/*", zone_name = "andeanscapes.com" }
]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

[[rules]]
type = "Text"
globs = ["**/BUILD_ID"]
fallthrough = true

# Public configuration, not a credential: this is an unauthenticated CDN URL
# serving the same marketing content the site already renders. Safe to commit.
#
# Supplies the *runtime* value only. The *build-time* value comes from the
# GitHub Actions variables REMOTE_DATA_BASE_URL_PROD / REMOTE_DATA_BASE_URL_DEV
# during deploy, so the two must be kept in sync.
#
# Unset is NOT a supported state. There is no local fallback data: the mocks and
# registries were deleted when the feed became the single source of truth, so
# `remote-data.ts` returns a null payload and every service throws. Unsetting this
# takes the landing page, the catalog and every experience page to the error
# boundary. The deploy workflows fail fast on an empty value for that reason.
[vars]
REMOTE_DATA_BASE_URL = "https://cdn.andeanscapes.com/services"
# Mercado Pago checkout mode. Public flag, not a credential. The access token is
# a Worker secret (`wrangler secret put MERCADOPAGO_ACCESS_TOKEN`) and must be a
# real-account token here; test credentials are rejected in this mode.
MERCADOPAGO_MODE = "production"
ALERT_EMAIL_FROM = "Andean Scapes <reservas@notify.andeanscapes.com>"
# Telegram payment alerts read the Worker secrets TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID (same bot and bridge chat as the WhatsApp sales bot).
# Email alerts read the Worker secrets RESEND_API_KEY and ALERT_EMAIL_TO, and the
# var ALERT_EMAIL_FROM (an address on a domain verified in Resend).
#
# NEXT_PUBLIC_WHATSAPP_PHONE_NUMBER is deliberately NOT declared here. It is
# inlined into the client bundle by `next build`, so a runtime var would be dead
# configuration that silently disagrees with what the browser actually ships.
# Supply it to the build instead: the NEXT_PUBLIC_WHATSAPP_PHONE_NUMBER CI
# variable, or `.env.local` for a local build. See `.env.example`.

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "andean-v3"

[env.dev]
name = "andean-v3-dev"
routes = []
# Points at the same feed as prod: there is currently no separate dev feed.
# Sandbox checkout: needs test credentials (`wrangler secret put MERCADOPAGO_ACCESS_TOKEN --env dev`).
vars = { REMOTE_DATA_BASE_URL = "https://cdn.andeanscapes.com/services", MERCADOPAGO_MODE = "sandbox", ALERT_EMAIL_FROM = "Andean Scapes <reservas@notify.andeanscapes.com>" }

[[env.dev.services]]
binding = "WORKER_SELF_REFERENCE"
service = "andean-v3-dev"
